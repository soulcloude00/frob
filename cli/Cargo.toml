[package]
name = "frob"
version = "0.43.0"
edition = "2021"
description = "Fast browser automation CLI for AI agents"
license = "Apache-2.0"
repository = "https://github.com/soulcloude00/frob"
homepage = "https://github.com/soulcloude00/frob"
readme = "../README.md"
keywords = ["browser", "automation", "ai", "cdp", "chrome"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
# Chrome screenshots are PNG, JPEG, or WebP; GIF and BMP cover user-supplied
# diff baselines. The default set also builds AVIF, EXR, TIFF and others.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
sha2 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
socket2 = "0.6"
similar = "2"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
rust-embed = "8"
psl = "=2.1.246"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Size-optimized: commands spend their time waiting on the browser, and this
# measured no slower than opt-level 3 on snapshot, screenshot, and eval while
# cutting the binary by 15%. The crates below do the CPU-bound work (image
# decoding and encoding, JSON, hashing, encryption) and stay at opt-level 3.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.serde]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.aes]
opt-level = 3

[profile.release.package.aes-gcm]
opt-level = 3

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

# Keep image processing real-time while application code remains debuggable.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# Dependencies are not stepped through, and their debug info is most of target/.
[profile.dev.package."*"]
debug = false
